services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: enyelberth
      POSTGRES_DB: KAIZEN
      POSTGRES_PASSWORD: 30204334
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "50000:50000"
    depends_on:
      - db

volumes:
  pgdata:

